        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

  <style>
    /* Efeito 3D para os Flashcards */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    /* Animação suave de entrada */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeSlideUp 0.35s ease-out forwards;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 selection:bg-indigo-500 selection:text-white">

                question: 'Complete com o conectivo avançado adequado: "The strategy is risky; _____, it offers the highest return."',
                options: ['albeit', 'nevertheless', 'despite', 'whereas'],
                correct: 1,
                explanation: '"Nevertheless" (contudo / ainda assim) conecta duas orações completas expressando contraste.'
              }
            ]
          }
        ]
      }
    };

    /**
     * LISTA DE MEDALHAS / CONQUISTAS DO SISTEMA
     */
    const BADGES_CATALOG = [
      { id: 'first_step', icon: '🎯', title: 'Primeiro Passo', desc: 'Concluiu sua primeira lição no FluentPath.' },
      { id: 'audio_learner', icon: '🎧', title: 'Ouvido Afiado', desc: 'Praticou a pronúncia nativa com o sintetizador de voz.' },
      { id: 'basic_master', icon: '🌱', title: 'Mestre do Básico (A1-A2)', desc: 'Completou 100% das lições do nível Básico.' },
      { id: 'inter_master', icon: '🚀', title: 'Explorador Intermediário (B1-B2)', desc: 'Completou 100% das lições do nível Intermediário.' },
      { id: 'adv_master', icon: '👑', title: 'Fluência Executiva (C1-C2)', desc: 'Completou 100% das lições do nível Avançado.' },
      { id: 'xp_500', icon: '⚡', title: 'Acumulador de XP', desc: 'Alcançou 300 ou mais pontos de experiência (XP).' }
    ];

    /**
     * CONTROLADOR PRINCIPAL DA APLICAÇÃO
     */
    const app = {
      state: {
        currentLevel: 'basic',     // 'basic' | 'intermediate' | 'advanced'
        view: 'dashboard',         // 'dashboard' | 'lesson'
        activeLessonId: null,
        activeTab: 'grammar',      // 'grammar' | 'vocab' | 'flashcards' | 'quiz'
        completedLessons: [],      // array de IDs ex: ['b1', 'b2']
        xp: 0,
        streak: 1,
        lastStudyDate: null,
        unlockedBadges: [],
        usedAudio: false,
        darkMode: false,
        // Estado temporário da lição atual
        flashcardIndex: 0,
        flashcardFlipped: false,
        quizAnswers: {},           // { questionIndex: selectedOptionIndex }
        quizSubmitted: false
      },

      init() {
        this.loadState();
        this.applyTheme();
        this.checkStreak();
        this.render();
      },

      // Carrega progresso do localStorage com segurança
      loadState() {
        try {
          const saved = localStorage.getItem('fluentpath_progress_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            this.state = { ...this.state, ...parsed, view: 'dashboard', activeLessonId: null };
          } else {
            // Detecta preferência de tema do sistema na primeira visita
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              this.state.darkMode = true;
            }
          }
        } catch (e) {
          console.error('Erro ao carregar progresso:', e);
        }
      },

      // Salva progresso no localStorage
      saveState() {
        try {
          const toSave = {
            currentLevel: this.state.currentLevel,
            completedLessons: this.state.completedLessons,
            xp: this.state.xp,
            streak: this.state.streak,
            lastStudyDate: this.state.lastStudyDate,
            unlockedBadges: this.state.unlockedBadges,
            usedAudio: this.state.usedAudio,
            darkMode: this.state.darkMode
          };
          localStorage.setItem('fluentpath_progress_v1', JSON.stringify(toSave));
        } catch (e) {
          console.error('Erro ao salvar progresso:', e);
        }
      },

      // Gerencia ofensiva (streak) diária
      checkStreak() {
        const today = new Date().toISOString().split('T')[0];
        if (!this.state.lastStudyDate) {
          this.state.lastStudyDate = today;
          this.state.streak = 1;
          this.saveState();
          return;
        }
        if (this.state.lastStudyDate !== today) {
          const last = new Date(this.state.lastStudyDate);
          const now = new Date(today);
          const diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
          if (diffDays === 1) {
            this.state.streak += 1;
          } else if (diffDays > 1) {
            this.state.streak = 1;
          }
          this.state.lastStudyDate = today;
          this.saveState();
        }
      },

      applyTheme() {
        const html = document.documentElement;
        const icon = document.getElementById('theme-icon');
        if (this.state.darkMode) {
          html.classList.add('dark');
          if (icon) icon.textContent = '☀️';
        } else {
          html.classList.remove('dark');
          if (icon) icon.textContent = '🌙';
        }
      },

      toggleDarkMode() {
        this.state.darkMode = !this.state.darkMode;
        this.applyTheme();
        this.saveState();
      },

      // Síntese de Voz Nativa (Web Speech API - en-US)
      speak(text, rate = 1.0) {
        if (!('speechSynthesis' in window)) {
          this.showToast('Seu navegador não suporta síntese de voz.', 'warning');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate; // 1.0 = normal, 0.65 = devagar

        // Tenta escolher uma voz nativa en-US de alta qualidade
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Natural')))
                     || voices.find(v => v.lang.startsWith('en-'));
        if (enVoice) utterance.voice = enVoice;

        window.speechSynthesis.speak(utterance);

        if (!this.state.usedAudio) {
          this.state.usedAudio = true;
          this.evaluateBadges();
          this.saveState();
        }
      },

      // Navegação e Seleção de Nível
      selectLevel(levelKey) {
        this.state.currentLevel = levelKey;
        this.state.view = 'dashboard';
        this.state.activeLessonId = null;
        this.saveState();
        this.render();
      },

      goHome() {
        this.state.view = 'dashboard';
        this.state.activeLessonId = null;
        this.render();
      },

      openLesson(lessonId) {
        this.state.view = 'lesson';
        this.state.activeLessonId = lessonId;
        this.state.activeTab = 'grammar';
        this.state.flashcardIndex = 0;
        this.state.flashcardFlipped = false;
        this.state.quizAnswers = {};
        this.state.quizSubmitted = false;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      setLessonTab(tabName) {
        this.state.activeTab = tabName;
        this.render();
      },

      // Controles dos Flashcards
      flipFlashcard() {
        this.state.flashcardFlipped = !this.state.flashcardFlipped;
        this.render();
      },

      nextFlashcard(total) {
        this.state.flashcardFlipped = false;
        this.state.flashcardIndex = (this.state.flashcardIndex + 1) % total;
        this.render();
      },

      prevFlashcard(total) {
        this.state.flashcardFlipped = false;
        this.state.flashcardIndex = (this.state.flashcardIndex - 1 + total) % total;
        this.render();
      },

      // Controles do Quiz
      selectQuizOption(qIdx, optIdx) {
        if (this.state.quizSubmitted) return;
        this.state.quizAnswers[qIdx] = optIdx;
        this.render();
      },

      submitQuiz() {
        const lesson = this.getActiveLesson();
        if (!lesson) return;
        const totalQ = lesson.quiz.length;
        if (Object.keys(this.state.quizAnswers).length < totalQ) {
          this.showToast('Responda todas as perguntas antes de finalizar o quiz!', 'warning');
          return;
        }
        this.state.quizSubmitted = true;

        let correctCount = 0;
        lesson.quiz.forEach((q, idx) => {
          if (this.state.quizAnswers[idx] === q.correct) correctCount++;
        });

        const passed = correctCount >= Math.ceil(totalQ * 0.6); // Mínimo 60% de acerto
        if (passed) {
          const alreadyCompleted = this.state.completedLessons.includes(lesson.id);
          if (!alreadyCompleted) {
            this.state.completedLessons.push(lesson.id);
            this.state.xp += lesson.xp;
            this.showToast(`Parabéns! Lição concluída (+${lesson.xp} XP) 🎉`, 'success');
          } else {
            this.showToast(`Excelente revisão! Você acertou ${correctCount} de ${totalQ}.`, 'success');
          }
          this.evaluateBadges();
          this.saveState();
        } else {
          this.showToast(`Você acertou ${correctCount} de ${totalQ}. Revise o guia e tente novamente!`, 'error');
        }
        this.render();
      },

      retryQuiz() {
        this.state.quizAnswers = {};
        this.state.quizSubmitted = false;
        this.render();
      },

      // Avalia e desbloqueia medalhas
      evaluateBadges() {
        const newlyUnlocked = [];
        const unlock = (id) => {
          if (!this.state.unlockedBadges.includes(id)) {
            this.state.unlockedBadges.push(id);
            const badge = BADGES_CATALOG.find(b => b.id === id);
            if (badge) newlyUnlocked.push(badge);
          }
        };

        if (this.state.completedLessons.length >= 1) unlock('first_step');
        if (this.state.usedAudio) unlock('audio_learner');
        if (this.state.xp >= 300) unlock('xp_500');

        const basicIds = COURSE_DATA.basic.lessons.map(l => l.id);
        if (basicIds.every(id => this.state.completedLessons.includes(id))) unlock('basic_master');

        const interIds = COURSE_DATA.intermediate.lessons.map(l => l.id);
        if (interIds.every(id => this.state.completedLessons.includes(id))) unlock('inter_master');

        const advIds = COURSE_DATA.advanced.lessons.map(l => l.id);
        if (advIds.every(id => this.state.completedLessons.includes(id))) unlock('adv_master');

        newlyUnlocked.forEach(b => {
          this.showToast(`Nova Medalha Desbloqueada: ${b.icon} ${b.title}!`, 'badge');
        });
      },

      // Cálculos de Progresso
      getProgressStats() {
        const allLessons = [
          ...COURSE_DATA.basic.lessons,
          ...COURSE_DATA.intermediate.lessons,
          ...COURSE_DATA.advanced.lessons
        ];
        const totalCompleted = this.state.completedLessons.length;
        const overallPercent = Math.round((totalCompleted / allLessons.length) * 100);

        const levelStats = {};
        ['basic', 'intermediate', 'advanced'].forEach(lvl => {
          const lessons = COURSE_DATA[lvl].lessons;
          const done = lessons.filter(l => this.state.completedLessons.includes(l.id)).length;
          levelStats[lvl] = {
            done,
            total: lessons.length,
            percent: Math.round((done / lessons.length) * 100)
          };
        });

        return { overallPercent, totalCompleted, totalLessons: allLessons.length, levelStats };
      },

      getActiveLesson() {
        for (const lvl of ['basic', 'intermediate', 'advanced']) {
          const found = COURSE_DATA[lvl].lessons.find(l => l.id === this.state.activeLessonId);
          if (found) return found;
        }
        return null;
      },

      // Modal de Conquistas
      toggleBadgesModal(show) {
        const modal = document.getElementById('badges-modal');
        if (!modal) return;
        if (show) {
          this.renderBadgesGrid();
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        } else {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
      },

      renderBadgesGrid() {
        const grid = document.getElementById('badges-grid');
        if (!grid) return;
        grid.innerHTML = BADGES_CATALOG.map(b => {
          const unlocked = this.state.unlockedBadges.includes(b.id);
          return `
            <div class="p-3.5 rounded-2xl border ${unlocked
              ? 'bg-amber-50/70 dark:bg-amber-950/30 border-amber-300 dark:border-amber-700/60'
              : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-800 opacity-60'} flex items-start gap-3">
              <div class="text-2xl ${unlocked ? '' : 'grayscale'}">${b.icon}</div>
              <div>
                <div class="font-bold text-sm flex items-center gap-1.5">
                  <span>${b.title}</span>
                  ${unlocked ? '<span class="text-[10px] bg-emerald-500 text-white px-1.5 py-0.5 rounded-full">Obtida</span>' : ''}
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${b.desc}</p>
              </div>
            </div>
          `;
        }).join('');
      },

      confirmResetProgress() {
        const btn = document.getElementById('btn-reset-progress');
        if (btn.dataset.confirming === 'true') {
          localStorage.removeItem('fluentpath_progress_v1');
          this.state.completedLessons = [];
          this.state.xp = 0;
          this.state.unlockedBadges = [];
          this.state.usedAudio = false;
          this.toggleBadgesModal(false);
          this.showToast('Progresso reiniciado com sucesso.', 'info');
          this.render();
        } else {
          btn.dataset.confirming = 'true';
          btn.textContent = 'Clique novamente para confirmar o reset';
          setTimeout(() => {
            if (btn) {
              btn.dataset.confirming = 'false';
              btn.textContent = 'Resetar progresso salvo';
            }
          }, 3500);
        }
      },

      // Sistema de Notificações Toast (Sem usar alert)
      showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = {
          success: 'bg-emerald-600 text-white border-emerald-500',
          error: 'bg-rose-600 text-white border-rose-500',
          warning: 'bg-amber-500 text-slate-950 border-amber-400',
          badge: 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white border-indigo-400',
          info: 'bg-slate-800 text-white border-slate-700'
        };
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold flex items-center gap-2 animate-fade-in max-w-sm ${colors[type] || colors.info}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3400);
      },

      // Atualiza Barra Superior
      updateHeaderUI() {
        document.getElementById('stat-xp').textContent = this.state.xp;
        document.getElementById('stat-streak').textContent = this.state.streak;
        document.getElementById('badge-count-pill').textContent = this.state.unlockedBadges.length;

        ['basic', 'intermediate', 'advanced'].forEach(lvl => {
          const btn = document.getElementById(`nav-lvl-${lvl}`);
          if (!btn) return;
          if (this.state.currentLevel === lvl) {
            btn.className = 'flex-1 sm:flex-initial px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm transition-all';
          } else {
            btn.className = 'flex-1 sm:flex-initial px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
          }
        });
      },

      // Renderização Principal
      render() {
        this.updateHeaderUI();
        const root = document.getElementById('app-root');
        if (!root) return;

        if (this.state.view === 'lesson' && this.state.activeLessonId) {
          root.innerHTML = this.renderLessonView();
        } else {
          root.innerHTML = this.renderDashboardView();
        }
      },

      // TELA 1: PAINEL DO CURSO E TRILHA DE APRENDIZADO
      renderDashboardView() {
        const stats = this.getProgressStats();
        const levelData = COURSE_DATA[this.state.currentLevel];
        const lvlStat = stats.levelStats[this.state.currentLevel];

        const colorMap = {
          emerald: {
            badge: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400',
            bar: 'bg-emerald-500',
            border: 'border-emerald-200 dark:border-emerald-800/60',
            btn: 'bg-emerald-600 hover:bg-emerald-700'
          },
          indigo: {
            badge: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-400',
            bar: 'bg-indigo-600',
            border: 'border-indigo-200 dark:border-indigo-800/60',
            btn: 'bg-indigo-600 hover:bg-indigo-700'
          },
          violet: {
            badge: 'bg-violet-100 text-violet-700 dark:bg-violet-950 dark:text-violet-400',
            bar: 'bg-violet-600',
            border: 'border-violet-200 dark:border-violet-800/60',
            btn: 'bg-violet-600 hover:bg-violet-700'
          }
        }[levelData.color];

        return `
          <div class="animate-fade-in space-y-8">
            <!-- Banner de Progresso Geral -->
            <section class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-sm">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5">
                <div>
                  <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-3 py-1 rounded-full mb-2">
                    Seu Painel de Fluência
                  </span>
                  <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 dark:text-white">
                    Escolha seu nível e evolua no inglês
                  </h1>
                  <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Você concluiu <strong>${stats.totalCompleted} de ${stats.totalLessons}</strong> módulos completos do curso (${stats.overallPercent}%).
                  </p>
                </div>
                <div class="w-full md:w-64 bg-slate-50 dark:bg-slate-800/70 p-4 rounded-2xl border border-slate-200/70 dark:border-slate-700/60">
                  <div class="flex justify-between text-xs font-bold mb-1.5">
                    <span class="text-slate-600 dark:text-slate-300">Progresso Geral</span>
                    <span class="text-indigo-600 dark:text-indigo-400">${stats.overallPercent}%</span>
                  </div>
                  <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-500" style="width: ${stats.overallPercent}%"></div>
                  </div>
                </div>
              </div>

              <!-- Cards de Seleção dos 3 Níveis -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${['basic', 'intermediate', 'advanced'].map(key => {
                  const item = COURSE_DATA[key];
                  const st = stats.levelStats[key];
                  const isSelected = this.state.currentLevel === key;
                  return `
                    <button onclick="app.selectLevel('${key}')" class="text-left p-5 rounded-2xl border-2 transition-all ${isSelected
                      ? 'border-indigo-600 bg-indigo-50/40 dark:bg-indigo-950/20 shadow-md'
                      : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-slate-300 dark:hover:border-slate-700'}">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-2xl">${item.icon}</span>
                        <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                          CEFR ${item.cefr}
                        </span>
                      </div>
                      <h2 class="font-display font-bold text-lg text-slate-900 dark:text-white">${item.title}</h2>
                      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">${item.description}</p>
                      <div class="mt-4">
                        <div class="flex justify-between text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">
                          <span>${st.done}/${st.total} lições</span>
                          <span>${st.percent}%</span>
                        </div>
                        <div class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                          <div class="h-full bg-indigo-600 rounded-full transition-all duration-500" style="width: ${st.percent}%"></div>
                        </div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </section>

            <!-- Trilha de Lições do Nível Ativo -->
            <section class="space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div class="flex items-center gap-3">
                  <span class="text-3xl">${levelData.icon}</span>
                  <div>
                    <div class="flex items-center gap-2">
                      <h2 class="font-display font-extrabold text-xl sm:text-2xl text-slate-900 dark:text-white">
                        Trilha: ${levelData.title}
                      </h2>
                      <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full ${colorMap.badge}">${levelData.cefr}</span>
                    </div>
                    <p class="text-sm text-slate-500 dark:text-slate-400">${levelData.description}</p>
                  </div>
                </div>
                <div class="text-xs font-bold text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 self-start sm:self-auto">
                  Concluído no nível: <span class="text-indigo-600 dark:text-indigo-400">${lvlStat.percent}%</span>
                </div>
              </div>

              <!-- Lista de Lições -->
              <div class="grid grid-cols-1 gap-4">
                ${levelData.lessons.map(lesson => {
                  const isDone = this.state.completedLessons.includes(lesson.id);
                  return `
                    <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 border ${isDone ? 'border-emerald-300 dark:border-emerald-800/70' : 'border-slate-200 dark:border-slate-800'} shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                      <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-2xl shrink-0 flex items-center justify-center font-display font-extrabold text-lg ${isDone
                          ? 'bg-emerald-500 text-white'
                          : 'bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400'}">
                          ${isDone ? '✓' : lesson.number}
                        </div>
                        <div>
                          <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Lição ${lesson.number}</span>
                            <span class="text-slate-300 dark:text-slate-700">•</span>
                            <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">⏱️ ${lesson.duration}</span>
                            <span class="text-slate-300 dark:text-slate-700">•</span>
                            <span class="text-xs font-bold text-amber-600 dark:text-amber-400">⚡ +${lesson.xp} XP</span>
                            ${isDone ? '<span class="text-[11px] font-bold bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 px-2.5 py-0.5 rounded-full">Concluída</span>' : ''}
                          </div>
                          <h3 class="font-display font-bold text-lg sm:text-xl text-slate-900 dark:text-white">
                            ${lesson.title}
                          </h3>
                          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                            ${lesson.summary}
                          </p>
                          <!-- Tags das atividades inclusas -->
                          <div class="flex flex-wrap gap-2 mt-3">
                            <span class="text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">📘 Guia Gramatical</span>
                            <span class="text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">🔊 ${lesson.vocabulary.length} Áudios Nativos</span>
                            <span class="text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">🗂️ ${lesson.flashcards.length} Flashcards</span>
                            <span class="text-[11px] font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">✅ Quiz Prático</span>
                          </div>
                        </div>
                      </div>

                      <button onclick="app.openLesson('${lesson.id}')" class="w-full sm:w-auto shrink-0 px-6 py-3.5 rounded-2xl font-bold text-sm text-white shadow-sm transition-all flex items-center justify-center gap-2 ${isDone
                        ? 'bg-emerald-600 hover:bg-emerald-700'
                        : 'bg-indigo-600 hover:bg-indigo-700'}">
                        <span>${isDone ? 'Revisar Lição' : 'Estudar Agora'}</span>
                        <span>→</span>
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>
        `;
      },

      // TELA 2: AMBIENTE INTERATIVO DA LIÇÃO
      renderLessonView() {
        const lesson = this.getActiveLesson();
        if (!lesson) return this.renderDashboardView();
        const levelData = COURSE_DATA[this.state.currentLevel];
        const isDone = this.state.completedLessons.includes(lesson.id);

        const tabs = [
          { id: 'grammar', icon: '📘', label: '1. Guia & Gramática' },
          { id: 'vocab', icon: '🔊', label: '2. Vocabulário & Áudio' },
          { id: 'flashcards', icon: '🗂️', label: '3. Flashcards' },
          { id: 'quiz', icon: '✅', label: '4. Quiz Prático' }
        ];

        return `
          <div class="animate-fade-in space-y-6">
            <!-- Cabeçalho da Lição -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
              <div>
                <button onclick="app.goHome()" class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline mb-2">
                  ← Voltar para a trilha (${levelData.title})
                </button>
                <div class="flex flex-wrap items-center gap-2">
                  <h1 class="font-display font-extrabold text-xl sm:text-2xl text-slate-900 dark:text-white">
                    Lição ${lesson.number}: ${lesson.title}
                  </h1>
                  ${isDone ? '<span class="text-xs font-bold bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 px-2.5 py-0.5 rounded-full">✓ Concluída</span>' : ''}
                </div>
              </div>
              <div class="flex items-center gap-2 self-start sm:self-auto">
                <span class="text-xs font-bold bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 px-3 py-1.5 rounded-xl border border-amber-200/60 dark:border-amber-800/50">
                  Recompensa: +${lesson.xp} XP
                </span>
              </div>
            </div>

            <!-- Abas de Navegação da Lição -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-white dark:bg-slate-900 p-2 rounded-2xl border border-slate-200 dark:border-slate-800">
              ${tabs.map(t => {
                const active = this.state.activeTab === t.id;
                return `
                  <button onclick="app.setLessonTab('${t.id}')" class="px-3 py-3 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-2 ${active
                    ? 'bg-indigo-600 text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                    <span>${t.icon}</span>
                    <span>${t.label}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Conteúdo da Aba Selecionada -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-sm">
              ${this.state.activeTab === 'grammar' ? this.renderGrammarTab(lesson) : ''}
              ${this.state.activeTab === 'vocab' ? this.renderVocabTab(lesson) : ''}
              ${this.state.activeTab === 'flashcards' ? this.renderFlashcardsTab(lesson) : ''}
              ${this.state.activeTab === 'quiz' ? this.renderQuizTab(lesson) : ''}
            </div>
          </div>
        `;
      },

      // ABA 1: GUIA GRAMATICAL E EXPLICAÇÃO
      renderGrammarTab(lesson) {
        const g = lesson.grammar;
        return `
          <div class="space-y-6 animate-fade-in">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Conceito Principal</span>
              <h2 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white mt-1">${g.title}</h2>
              <p class="text-slate-600 dark:text-slate-300 mt-2 leading-relaxed">${g.intro}</p>
            </div>

            <!-- Regras e Pontos-Chave -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${g.points.map(pt => `
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/60">
                  <div class="font-bold text-indigo-600 dark:text-indigo-400 text-sm mb-1">${pt.rule}</div>
                  <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${pt.desc}</p>
                </div>
              `).join('')}
            </div>

            <!-- Exemplos Práticos com Áudio -->
            <div class="space-y-3 pt-2">
              <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white">Exemplos na Prática (Clique para ouvir)</h3>
              ${g.examples.map(ex => {
                const safeText = ex.en.replace(/'/g, "\\'");
                return `
                  <div class="p-4 rounded-2xl border border-indigo-100 dark:border-indigo-900/50 bg-indigo-50/40 dark:bg-indigo-950/20 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <p class="font-bold text-slate-900 dark:text-white text-base">${ex.en}</p>
                      <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${ex.pt}</p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <button onclick="app.speak('${safeText}', 1.0)" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1.5 transition-colors">
                        🔊 Normal
                      </button>
                      <button onclick="app.speak('${safeText}', 0.65)" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-1 transition-colors" title="Ouvir mais devagar">
                        🐢 Lento
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="pt-4 flex justify-end">
              <button onclick="app.setLessonTab('vocab')" class="px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition-colors">
                Próximo: Vocabulário & Áudio →
              </button>
            </div>
          </div>
        `;
      },

      // ABA 2: VOCABULÁRIO E PRONÚNCIA NATIVA
      renderVocabTab(lesson) {
        return `
          <div class="space-y-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h2 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">Vocabulário & Expressões-Chave</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Ouça a pronúncia em inglês americano (en-US) em velocidade normal ou lenta e repita em voz alta.</p>
              </div>
            </div>

            <div class="divide-y divide-slate-200 dark:divide-slate-800 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
              ${lesson.vocabulary.map(item => {
                const safeText = item.en.replace(/'/g, "\\'");
                return `
                  <div class="p-4 sm:p-5 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <div class="font-bold text-base sm:text-lg text-slate-900 dark:text-white">${item.en}</div>
                      <div class="text-xs font-mono text-indigo-600 dark:text-indigo-400 mt-0.5">${item.phonetic}</div>
                      <div class="text-sm text-slate-500 dark:text-slate-400 mt-1">${item.pt}</div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <button onclick="app.speak('${safeText}', 1.0)" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition-all active:scale-95">
                        🔊 Ouvir
                      </button>
                      <button onclick="app.speak('${safeText}', 0.65)" class="px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold flex items-center gap-1 transition-all active:scale-95">
                        🐢 0.65x
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="pt-4 flex flex-wrap justify-between gap-3">
              <button onclick="app.setLessonTab('grammar')" class="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm transition-colors">
                ← Guia Gramatical
              </button>
              <button onclick="app.setLessonTab('flashcards')" class="px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition-colors">
                Próximo: Treinar com Flashcards →
              </button>
            </div>
          </div>
        `;
      },

      // ABA 3: FLASHCARDS INTERATIVOS 3D
      renderFlashcardsTab(lesson) {
        const cards = lesson.flashcards;
        const idx = this.state.flashcardIndex;
        const card = cards[idx];
        const safeFront = card.front.replace(/'/g, "\\'");

        return `
          <div class="space-y-6 animate-fade-in">
            <div class="text-center max-w-xl mx-auto">
              <h2 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">Flashcards de Memorização Ativa</h2>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Clique no cartão para virá-lo e testar sua memória antes de ver a tradução.</p>
            </div>

            <!-- Indicador de Progresso dos Cartões -->
            <div class="flex items-center justify-center gap-2">
              ${cards.map((_, i) => `
                <span class="h-2 rounded-full transition-all ${i === idx ? 'w-8 bg-indigo-600' : 'w-2 bg-slate-300 dark:bg-slate-700'}"></span>
              `).join('')}
            </div>

            <!-- Cartão 3D Interativo -->
            <div class="max-w-lg mx-auto perspective-1000">
              <div onclick="app.flipFlashcard()" class="relative w-full min-h-[250px] sm:min-h-[270px] cursor-pointer transform-style-3d ${this.state.flashcardFlipped ? 'rotate-y-180' : ''}">
                
                <!-- Frente do Cartão (Inglês) -->
                <div class="absolute inset-0 backface-hidden rounded-3xl p-6 sm:p-8 bg-gradient-to-br from-indigo-600 to-violet-700 text-white shadow-xl flex flex-col items-center justify-between text-center">
                  <div class="w-full flex items-center justify-between text-xs font-bold opacity-80">
                    <span>INGLÊS • CARTÃO ${idx + 1}/${cards.length}</span>
                    <button onclick="event.stopPropagation(); app.speak('${safeFront}', 1.0)" class="px-3 py-1.5 rounded-xl bg-white/20 hover:bg-white/30 text-white font-bold transition-colors">
                      🔊 Ouvir
                    </button>
                  </div>
                  <div class="my-auto py-4">
                    <p class="font-display font-extrabold text-2xl sm:text-3xl leading-snug">${card.front}</p>
                    <p class="text-xs text-indigo-100 mt-3 bg-white/10 px-3 py-1 rounded-full inline-block">💡 Dica: ${card.hint}</p>
                  </div>
                  <span class="text-xs font-semibold opacity-75">Toque no cartão para ver a tradução ↻</span>
                </div>

                <!-- Verso do Cartão (Português) -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl p-6 sm:p-8 bg-slate-900 dark:bg-slate-800 text-white border-2 border-indigo-500 shadow-xl flex flex-col items-center justify-between text-center">
                  <div class="w-full flex items-center justify-between text-xs font-bold text-indigo-400">
                    <span>TRADUÇÃO EM PORTUGUÊS</span>
                    <button onclick="event.stopPropagation(); app.speak('${safeFront}', 0.7)" class="px-3 py-1.5 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 font-bold transition-colors">
                      🐢 Áudio Lento
                    </button>
                  </div>
                  <div class="my-auto py-4">
                    <p class="font-display font-extrabold text-2xl sm:text-3xl text-emerald-400 leading-snug">${card.back}</p>
                    <p class="text-sm text-slate-400 mt-3 italic">"${card.front}"</p>
                  </div>
                  <span class="text-xs font-semibold text-slate-400">Toque para voltar ao inglês ↻</span>
                </div>

              </div>
            </div>

            <!-- Controles de Navegação dos Flashcards -->
            <div class="flex items-center justify-center gap-3 pt-2">
              <button onclick="app.prevFlashcard(${cards.length})" class="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm transition-colors">
                ← Anterior
              </button>
              <button onclick="app.flipFlashcard()" class="px-5 py-3 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-bold text-sm border border-indigo-200 dark:border-indigo-800 transition-colors">
                Virar Cartão
              </button>
              <button onclick="app.nextFlashcard(${cards.length})" class="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm transition-colors">
                Próximo →
              </button>
            </div>

            <div class="pt-4 flex flex-wrap justify-between gap-3 border-t border-slate-200 dark:border-slate-800">
              <button onclick="app.setLessonTab('vocab')" class="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm transition-colors">
                ← Vocabulário
              </button>
              <button onclick="app.setLessonTab('quiz')" class="px-6 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm transition-colors">
                Ir para o Quiz Prático →
              </button>
            </div>
          </div>
        `;
      },

      // ABA 4: QUIZ PRÁTICO COM FEEDBACK COMENTADO
      renderQuizTab(lesson) {
        const submitted = this.state.quizSubmitted;
        let correctCount = 0;
        if (submitted) {
          lesson.quiz.forEach((q, idx) => {
            if (this.state.quizAnswers[idx] === q.correct) correctCount++;
          });
        }

        return `
          <div class="space-y-6 animate-fade-in">
            <div>
              <h2 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">Quiz de Validação da Lição</h2>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Responda às questões abaixo para concluir esta lição e ganhar <strong>+${lesson.xp} XP</strong>.</p>
            </div>

            ${submitted ? `
              <div class="p-5 rounded-2xl border ${correctCount >= Math.ceil(lesson.quiz.length * 0.6)
                ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200'
                : 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200'}">
                <div class="font-display font-extrabold text-lg">
                  Resultado: Você acertou ${correctCount} de ${lesson.quiz.length} questões!
                </div>
                <p class="text-sm mt-1">
                  ${correctCount >= Math.ceil(lesson.quiz.length * 0.6)
                    ? 'Excelente trabalho! Seu progresso foi salvo automaticamente.'
                    : 'Você precisa acertar pelo menos 2 questões para concluir a lição. Veja as explicações abaixo e tente novamente.'}
                </p>
              </div>
            ` : ''}

            <div class="space-y-6">
              ${lesson.quiz.map((q, qIdx) => {
                const userAns = this.state.quizAnswers[qIdx];
                return `
                  <div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 space-y-3">
                    <p class="font-bold text-base text-slate-900 dark:text-white">
                      <span class="text-indigo-600 dark:text-indigo-400 mr-1">${qIdx + 1}.</span> ${q.question}
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      ${q.options.map((opt, optIdx) => {
                        const isSelected = userAns === optIdx;
                        const isCorrect = q.correct === optIdx;
                        let btnClass = 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 hover:border-indigo-400';

                        if (!submitted && isSelected) {
                          btnClass = 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-600 text-indigo-700 dark:text-indigo-300 ring-2 ring-indigo-500/20';
                        } else if (submitted) {
                          if (isCorrect) {
                            btnClass = 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500 text-emerald-800 dark:text-emerald-200 font-bold';
                          } else if (isSelected && !isCorrect) {
                            btnClass = 'bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-800 dark:text-rose-200';
                          } else {
                            btnClass = 'bg-white/60 dark:bg-slate-900/60 border-slate-200 dark:border-slate-800 opacity-60';
                          }
                        }

                        return `
                          <button onclick="app.selectQuizOption(${qIdx}, ${optIdx})" ${submitted ? 'disabled' : ''} class="text-left p-3.5 rounded-xl border text-sm font-medium transition-all flex items-center justify-between gap-2 ${btnClass}">
                            <span>${opt}</span>
                            ${submitted && isCorrect ? '<span>✅</span>' : ''}
                            ${submitted && isSelected && !isCorrect ? '<span>❌</span>' : ''}
                          </button>
                        `;
                      }).join('')}
                    </div>

                    ${submitted ? `
                      <div class="mt-3 p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-600 dark:text-slate-300">
                        <strong class="text-indigo-600 dark:text-indigo-400">Explicação:</strong> ${q.explanation}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="pt-4 flex flex-wrap items-center justify-between gap-3">
              <button onclick="app.setLessonTab('flashcards')" class="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm transition-colors">
                ← Flashcards
              </button>

              <div class="flex items-center gap-3">
                ${submitted ? `
                  <button onclick="app.retryQuiz()" class="px-5 py-3 rounded-2xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold text-sm transition-colors">
                    Refazer Quiz
                  </button>
                  <button onclick="app.goHome()" class="px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition-colors">
                    Concluir e Voltar à Trilha →
                  </button>
                ` : `
                  <button onclick="app.submitQuiz()" class="px-7 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md shadow-emerald-600/20 transition-all">
                    Verificar Respostas ✓
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }
    };

    // Garante o carregamento inicial das vozes do SpeechSynthesis
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
